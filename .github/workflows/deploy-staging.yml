name: Deploy to Staging

on:
  push:
    branches: [main]

# Protect staging deployments — require environment approval in GitHub Settings
# > Environments > staging > Required reviewers (optional for staging, required for prod)
env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: africa-south1
  REGISTRY: africa-south1-docker.pkg.dev

jobs:
  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    # environment: staging  # uncomment to add approval gate
    permissions:
      contents: read
      id-token: write  # for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      # ── GCP Auth ─────────────────────────────────────────────────────────
      # Authenticate via Workload Identity Federation (recommended) or Service Account key.
      # Set GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT secrets in:
      #   GitHub Settings > Secrets > Actions
      #
      # - name: Authenticate to GCP
      #   uses: google-github-actions/auth@v2
      #   with:
      #     workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      #     service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      #
      # - name: Set up Cloud SDK
      #   uses: google-github-actions/setup-gcloud@v2
      #
      # - name: Configure Docker for Artifact Registry
      #   run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Echo deploy steps (placeholder — configure GCP credentials to activate)
        run: |
          echo "=== KasiEats Staging Deploy ==="
          echo "Commit : ${{ github.sha }}"
          echo "Branch : ${{ github.ref_name }}"
          echo "Region : ${{ env.REGION }}"
          echo ""
          echo "Steps that will run once GCP_PROJECT_ID + auth secrets are set:"
          echo "  1. docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/kasieats/api:${{ github.sha }} -f apps/api/Dockerfile ."
          echo "  2. docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/kasieats/vendor-web:${{ github.sha }} --build-arg VITE_API_URL=\$STAGING_API_URL -f apps/vendor-web/Dockerfile ."
          echo "  3. docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/kasieats/admin-web:${{ github.sha }} --build-arg VITE_API_URL=\$STAGING_API_URL -f apps/admin-web/Dockerfile ."
          echo "  4. docker push all images to Artifact Registry"
          echo "  5. gcloud run deploy kasieats-api --image=... (or gce rolling update)"
          echo "  6. Run smoke tests against staging URL"
          echo ""
          echo "Required secrets (add in GitHub Settings > Secrets > Actions):"
          echo "  GCP_PROJECT_ID"
          echo "  GCP_WORKLOAD_IDENTITY_PROVIDER"
          echo "  GCP_SERVICE_ACCOUNT"
          echo "  STAGING_API_URL"
          echo "  STAGING_DATABASE_URL"
          echo "  STAGING_JWT_SECRET"

  # ── Smoke test placeholder ──────────────────────────────────────────────────
  smoke-test:
    name: Smoke test staging
    runs-on: ubuntu-latest
    needs: build-and-push
    # environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke tests (placeholder)
        run: |
          echo "Smoke tests will run against: ${{ secrets.STAGING_API_URL || 'https://api.staging.kasieats.co.za' }}"
          echo "Configure STAGING_API_URL secret to enable real smoke tests."
          # Uncomment when staging is live:
          # bash scripts/smoke-test.sh
        env:
          API_URL: ${{ secrets.STAGING_API_URL }}
