services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: kasieats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kasieats_user
      POSTGRES_PASSWORD: kasieats_password
      POSTGRES_DB: kasieats
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasieats_user -d kasieats"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kasieats-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kasieats-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: kasieats_user
      RABBITMQ_DEFAULT_PASS: kasieats_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kasieats-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://kasieats_user:kasieats_password@postgres:5432/kasieats
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://kasieats_user:kasieats_password@rabbitmq:5672
      JWT_SECRET: change-me-in-production-use-long-random-string
      JWT_EXPIRES_IN: 7d
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGIN: http://localhost:3001,http://localhost:3002,http://localhost:8081,http://localhost:8082
      PAYMENTS_SANDBOX: "true"
      SMS_PROVIDER: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
