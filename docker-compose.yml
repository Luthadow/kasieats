services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: kasieats-postgres
    environment:
      POSTGRES_USER: kasieats_user
      POSTGRES_PASSWORD: kasieats_password
      POSTGRES_DB: kasieats
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasieats_user -d kasieats"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kasieats-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
